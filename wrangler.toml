name = "github-upm-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Non-secret configuration. Override per-environment below or with `wrangler deploy --var`.
[vars]
GITHUB_ORG = "PackmuleRegistry"
UPSTREAM_REGISTRY = "https://npm.pkg.github.com"
CACHE_TTL_SECONDS = "300"
FETCH_CONCURRENCY = "8"
GITHUB_API_URL = "https://api.github.com"

# KV namespace backing the shared, stale-while-revalidate package-list cache.
# Create with `wrangler kv namespace create PACKUMENT_CACHE` and paste the id below.
[[kv_namespaces]]
binding = "PACKUMENT_CACHE"
id = "5aa0024a4bab4e3fbfcf535f07131e0e"

# Proactively refreshes the cache in the background so user requests rarely need to
# block on a live GitHub fetch. Adjust to taste; must stay <= CACHE_TTL_SECONDS.
[triggers]
crons = ["*/5 * * * *"]

# Secrets (set with `wrangler secret put <NAME>`, never committed):
#   GITHUB_TOKEN      - GitHub PAT (classic) with `read:packages` scope. Used server-side
#                        to authenticate all requests to the GitHub npm registry / REST API.
#   PROXY_AUTH_TOKEN  - Optional shared secret. When set, clients (Unity's upmconfig.toml)
#                        must send `Authorization: Bearer <PROXY_AUTH_TOKEN>` to use this worker.

# Example additional environment:
# [env.staging.vars]
# GITHUB_ORG = "PackmuleRegistry"
# UPSTREAM_REGISTRY = "https://npm.pkg.github.com"
# CACHE_TTL_SECONDS = "60"
# GITHUB_API_URL = "https://api.github.com"
